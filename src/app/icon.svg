<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Global Kindness Map</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity=".70"/>
      <stop offset="45%" stop-color="#ffb347" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe3b4"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <clipPath id="globe">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
  </defs>

  <!-- Night ground. Solid, so the mark reads on a light or a dark tab. -->
  <circle cx="32" cy="32" r="30" fill="#071018"/>

  <!--
    Graticule. In an orthographic view with the pole up, parallels project
    to straight horizontal lines and meridians to ellipses — so this is the
    real geometry, not a decorative grid.
  -->
  <g clip-path="url(#globe)" fill="none" stroke="#1d3242" stroke-width="1.4" stroke-linecap="round">
    <line x1="2" y1="32" x2="62" y2="32"/>
    <line x1="7" y1="17" x2="57" y2="17"/>
    <line x1="7" y1="47" x2="57" y2="47"/>
    <ellipse cx="32" cy="32" rx="11" ry="30"/>
    <ellipse cx="32" cy="32" rx="23" ry="30"/>
  </g>

  <circle cx="32" cy="32" r="30" fill="none" stroke="#24455a" stroke-width="1.6"/>

  <!-- A second, fainter light: one act is never the only one. -->
  <circle cx="22" cy="43" r="2.4" fill="#ffb347" opacity=".38"/>

  <!-- The act of kindness. -->
  <circle cx="41" cy="22" r="16" fill="url(#halo)"/>
  <circle cx="41" cy="22" r="6.6" fill="url(#lamp)"/>
</svg>
